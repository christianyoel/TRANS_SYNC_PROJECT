server.port=8082
spring.application.name=ms-pasajes

# ── PostgreSQL en Docker (puerto 5434 del host → 5432 del contenedor) ──────
spring.datasource.url=jdbc:postgresql://localhost:5434/trans_sync_bd_pasajes
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

ms-viajes.url=http://localhost:8083

management.endpoints.web.exposure.include=health
