server.port=8081
spring.application.name=ms-usuarios

# ── PostgreSQL en Docker (puerto 5433 del host → 5432 del contenedor) ──────
spring.datasource.url=jdbc:postgresql://localhost:5433/trans_sync_bd_usuarios
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=trans-sync-jwt-secret-key-2026-synergy6-dev-only-must-be-long-enough
jwt.expiration-ms=86400000

management.endpoints.web.exposure.include=health
